openapi: 3.1.0
info:
  title: ms-users API
  version: 1.0.0
  description: "Cubre HU-USR-01, 02, 04, 05, 06, 07, 08 y 09. HU-USR-03 fue retirada (ARCHITECTURE no contempla bloqueo temporal)."
  license:
    name: Uso académico (Práctica 1)
servers:
  - url: http://localhost:8081
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Registrar un solicitante
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Iniciar sesión y obtener JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotar el refresh token y obtener un nuevo par de tokens
      description: Cada refresh token se usa una sola vez. Si se reutiliza uno ya rotado o revocado, se revocan todos los refresh tokens del usuario.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nuevo par de tokens emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Cerrar sesión revocando el refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me:
    get:
      operationId: getMyProfile
      summary: Consultar el perfil autenticado
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Listar usuarios, con filtro opcional por rol (solo ADMIN)
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [SOLICITANTE, AGENTE, ADMIN]
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUserByAdmin
      summary: Crear un usuario con rol asignado (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{id}:
    get:
      operationId: getUserById
      summary: Consultar un usuario por id (solo ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/status:
    patch:
      operationId: updateUserStatusByAdmin
      summary: Cambiar estado de una cuenta (solo ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72, description: Al menos una letra y un dígito }
        fullName: { type: string, minLength: 2, maxLength: 150 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, maxLength: 72 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 128 }
    CreateUserRequest:
      allOf:
        - $ref: '#/components/schemas/RegisterRequest'
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [SOLICITANTE, AGENTE, ADMIN] }
    UpdateStatusRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64, example: 900 }
        refreshExpiresIn: { type: integer, format: int64, example: 604800 }
    UserResponse:
      type: object
      required: [id, email, fullName, role, active, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [SOLICITANTE, AGENTE, ADMIN] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProblemDetail:
      type: object
      description: Error en formato RFC 9457 (application/problem+json)
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, example: USER_NOT_FOUND }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          description: Solo presente en errores 400 de validación
          items:
            type: object
            properties:
              field: { type: string, example: email }
              message: { type: string, example: debe tener formato de correo válido }
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Token o credenciales inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Operación no autorizada para el rol del usuario.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Usuario no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: El correo ya está registrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'