openapi: 3.0.3
info:
  title: API de Usuarios y Autenticación (ms-users)
  version: 1.0.0
  description: API REST para la gestión de usuarios y autenticación de la Mesa de Ayuda.
    Cubre HU-USR-01, HU-USR-02, HU-USR-05 y HU-USR-08.
    Las historias HU-USR-03, HU-USR-04, HU-USR-06 y HU-USR-07 quedan fuera del alcance de P1.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/auth/register:
    post:
      operationId: registerUser
      security: []
      summary: Registrar un solicitante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Correo ya registrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/login:
    post:
      operationId: loginUser
      security: []
      summary: Autenticarse y obtener un JWT firmado con HS256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Cuenta desactivada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '423':
          description: Cuenta bloqueada temporalmente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/users/me:
    get:
      operationId: getMyProfile
      summary: Obtener el perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Token ausente, alterado, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Usuario del token no encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      operationId: updateMyProfile
      summary: Actualizar el perfil del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Token ausente, alterado, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Usuario del token no encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/users/{userIdentifier}/status:
    patch:
      operationId: changeUserStatus
      summary: Cambiar el estado de una cuenta (solo ADMIN, HU-USR-08)
      security:
        - bearerAuth: []
      parameters:
        - name: userIdentifier
          in: path
          required: true
          description: Identificador público del usuario a actualizar
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Token ausente, alterado, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: El token es válido, pero no tiene rol ADMIN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Usuario no encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterUserRequest:
      type: object
      required: [name, paternalName, email, password]
      properties:
        name: { type: string, maxLength: 100 }
        paternalName: { type: string, maxLength: 100 }
        maternalName: { type: string, nullable: true, maxLength: 100 }
        email: { type: string, format: email, maxLength: 150 }
        password: { type: string, minLength: 8, maxLength: 50 }
    LoginRequest:
      type: object
      required: [email, softPassword]
      properties:
        email: { type: string, format: email }
        softPassword: { type: string }
    UpdateProfileRequest:
      type: object
      required: [name, paternalName]
      properties:
        name: { type: string, maxLength: 100 }
        paternalName: { type: string, maxLength: 100 }
        maternalName: { type: string, nullable: true, maxLength: 100 }
    UpdateUserStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    UserResponse:
      type: object
      properties:
        userIdentifier: { type: string }
        name: { type: string }
        paternalName: { type: string }
        maternalName: { type: string, nullable: true }
        email: { type: string, format: email }
        role: { type: string, enum: [SOLICITANTE, AGENTE, ADMIN] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64 }
        user:
          $ref: '#/components/schemas/UserResponse'
    ProblemDetail:
      type: object
      description: Error en formato RFC 9457 (application/problem+json)
      required: [type, title, status, detail, instance, code, timestamp]
      properties:
        type:
          type: string
          format: uri
          example: https://mesa-ayuda.ids/problems/user-not-found
        title:
          type: string
          example: Recurso no encontrado
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: Mensaje en español para el usuario
          example: No existe un usuario con id 999
        instance:
          type: string
          example: /api/v1/users/999
        code:
          type: string
          example: USER_NOT_FOUND
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Solo presente en errores 400 de validación
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: debe ser un correo válido
