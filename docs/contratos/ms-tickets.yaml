openapi: 3.0.3
info:
  title: ms-tickets API
  version: 0.1.0-draft
  description: >
    Borrador del contrato de ms-tickets. Identidad simulada con los encabezados
    X-User-Id y X-User-Role hasta la Práctica 3 (JWT). Los errores siguen RFC 9457 (ProblemDetail).
  license:
    name: Uso académico (Práctica 1)
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Tickets
    description: Gestión del ciclo de vida de los tickets
security:
  - simulatedIdentity: []
paths:
  /api/v1/tickets:
    post:
      tags: [Tickets]
      summary: Crear ticket
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/UserRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket creado
          headers:
            Location:
              description: URI del ticket creado
              schema:
                type: string
                example: /api/v1/tickets/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
    get:
      tags: [Tickets]
      summary: Listar tickets visibles para el usuario
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/UserRoleHeader'
        - name: status
          in: query
          required: false
          description: Filtra por estado
          schema:
            $ref: '#/components/schemas/TicketStatus'
      responses:
        '200':
          description: Lista de tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
  /api/v1/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Consultar ticket por ID
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/UserRoleHeader'
      responses:
        '200':
          description: Ticket encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/tickets/{id}/assignment:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      tags: [Tickets]
      summary: Asignar ticket a un agente
      operationId: assignTicket
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/UserRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: Ticket asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /api/v1/tickets/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      tags: [Tickets]
      summary: Cambiar estado del ticket
      operationId: changeTicketStatus
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/UserRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/v1/tickets/{id}/history:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Consultar historial del ticket
      operationId: getTicketHistory
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/UserRoleHeader'
      responses:
        '200':
          description: Historial de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
components:
  securitySchemes:
    simulatedIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: Identidad simulada. Se exige también X-User-Role (Práctica 1).
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: integer
        format: int64
        example: 10
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UserRole'
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
  schemas:
    UserRole:
      type: string
      enum: [SOLICITANTE, AGENTE, ADMIN]
    TicketStatus:
      type: string
      enum: [ABIERTO, ASIGNADO, EN_PROGRESO, RESUELTO, CERRADO, CANCELADO]
    HistoryEventType:
      type: string
      enum: [CREATED, ASSIGNED, STATUS_CHANGED]
    CreateTicketRequest:
      type: object
      required: [title, description, categoryId, priorityId]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 150
          example: Impresora sin red
        description:
          type: string
          minLength: 10
          maxLength: 4000
          example: La impresora del piso 2 no responde desde ayer
        categoryId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        priorityId:
          type: integer
          format: int64
          minimum: 1
          example: 2
    AssignRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: integer
          format: int64
          minimum: 1
          example: 2
    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        comment:
          type: string
          maxLength: 1000
          example: Revisando el equipo
    TicketResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        categoryId:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
        priorityCode:
          type: string
          example: ALTA
        requesterId:
          type: integer
          format: int64
        assigneeId:
          type: integer
          format: int64
          nullable: true
        responseDueAt:
          type: string
          format: date-time
        resolutionDueAt:
          type: string
          format: date-time
        overdue:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
    HistoryResponse:
      type: object
      properties:
        eventType:
          $ref: '#/components/schemas/HistoryEventType'
        fromStatus:
          $ref: '#/components/schemas/TicketStatus'
        toStatus:
          $ref: '#/components/schemas/TicketStatus'
        fromAssigneeId:
          type: integer
          format: int64
          nullable: true
        toAssigneeId:
          type: integer
          format: int64
          nullable: true
        changedBy:
          type: integer
          format: int64
        comment:
          type: string
          nullable: true
        changedAt:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      description: Respuesta de error RFC 9457 con código de negocio.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          example: TICKET_NOT_FOUND
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    ValidationError:
      description: Error de validación (VALIDATION_ERROR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    MalformedRequest:
      description: Falta o es inválido un encabezado requerido (MALFORMED_REQUEST)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Acceso denegado para el rol o usuario (403)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TicketNotFound:
      description: Ticket inexistente (TICKET_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidTransition:
      description: Transición de estado inválida (TICKET_INVALID_TRANSITION)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BusinessRuleError:
      description: Regla de negocio incumplida (422). Códigos CATEGORY_INVALID, PRIORITY_INVALID, ASSIGNEE_INVALID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
