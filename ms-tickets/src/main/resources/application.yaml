spring:
  application:
    name: ms-tickets
  datasource:
    url: ${TICKETS_DB_URL:jdbc:postgresql://localhost:5434/tickets_db}
    username: ${TICKETS_DB_USER:tickets}
    password: ${TICKETS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
clients:
  users:
    url: ${SERVICES_USERS_URL:http://localhost:8081}
  catalog:
    url: ${SERVICES_CATALOG_URL:http://localhost:8083}
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
