name: ci-isaac
on:
  push:
    branches: ["practica-*-isaac"]
    paths: ["ms-tickets/**", ".github/workflows/ci-isaac.yml"]
  pull_request:
    branches: [main]
    paths: ["ms-tickets/**", ".github/workflows/ci-isaac.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ms-tickets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Restaurar caché de la base de datos NVD (Dependency-Check)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-
      - name: Quality gates y pruebas (mvn verify)
        run: chmod +x mvnw && ./mvnw -B verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Guardar caché de la base de datos NVD (Dependency-Check)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ github.run_id }}
