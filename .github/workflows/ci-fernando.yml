name: ci-fernando
on:
  push:
    branches: ["practica-*-fernando"]
    paths: ["ms-users/**", ".github/workflows/ci-fernando.yml"]
  pull_request:
    branches: [main]
    paths: ["ms-users/**", ".github/workflows/ci-fernando.yml"]
concurrency:
  group: ci-fernando-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ms-users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Preparar clave diaria de cache NVD
        id: nvd-cache-key
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "data-directory=$RUNNER_TEMP/ms-users-dependency-check-data" >> "$GITHUB_OUTPUT"
      - name: Restaurar cache de datos de Dependency-Check
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.nvd-cache-key.outputs.data-directory }}
          key: nvd-${{ runner.os }}-ms-users-13.0.0-${{ steps.nvd-cache-key.outputs.day }}
          restore-keys: |
            nvd-${{ runner.os }}-ms-users-13.0.0-
      # La base NVD se actualiza aparte y se guarda en cuanto termina bien,
      # aunque después fallen pruebas o analizadores.
      - name: Actualizar datos NVD (con reintentos ante 503)
        run: |
          chmod +x mvnw
          for attempt in 1 2 3; do
            if ./mvnw -B "-DdataDirectory=$DEPENDENCY_CHECK_DATA_DIRECTORY" dependency-check:update-only; then
              exit 0
            fi
            echo "::warning::Fallo al actualizar NVD (intento $attempt de 3)"
            sleep $((attempt * 120))
          done
          exit 1
        env:
          DEPENDENCY_CHECK_DATA_DIRECTORY: ${{ steps.nvd-cache-key.outputs.data-directory }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Guardar cache de datos de Dependency-Check
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.nvd-cache-key.outputs.data-directory }}
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}
      - name: Quality gates y pruebas (mvn verify)
        run: chmod +x mvnw && ./mvnw -B "-DdataDirectory=$DEPENDENCY_CHECK_DATA_DIRECTORY" verify
        env:
          DEPENDENCY_CHECK_DATA_DIRECTORY: ${{ steps.nvd-cache-key.outputs.data-directory }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}