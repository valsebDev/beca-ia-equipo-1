services:
  db-users:
    image: postgres:16
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - mesa-ayuda

  ms-users:
    build: ./ms-users
    image: ms-users:0.0.1
    environment:
      # La app lee ${PORT:8081}; el contenedor debe escuchar en 8080 (EXPOSE y HEALTHCHECK).
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-users:5432/users_db
      SPRING_DATASOURCE_USERNAME: ${USERS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USERS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db-users:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - mesa-ayuda

networks:
  mesa-ayuda:
    driver: bridge
