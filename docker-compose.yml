services:
  db-tickets:
    image: postgres:16
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: ${TICKETS_DB_USER}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d tickets_db -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    networks:
      - mesa-ayuda

  ms-tickets:
    build: ./ms-tickets
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-tickets:5432/tickets_db
      SPRING_DATASOURCE_USERNAME: ${TICKETS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TICKETS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      SERVICES_USERS_URL: http://ms-users:8080
      SERVICES_CATALOG_URL: http://ms-catalog:8080
    depends_on:
      db-tickets:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - mesa-ayuda

networks:
  mesa-ayuda:
    driver: bridge
